<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#02050a"/><stop offset=".5" stop-color="#07131d"/><stop offset="1" stop-color="#020409"/>
  </linearGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#a5f3fc"/><stop offset="1" stop-color="#22d3ee"/>
  </linearGradient>
  <linearGradient id="purple" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#818cf8"/><stop offset="1" stop-color="#c084fc"/>
  </linearGradient>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
    <path d="M36 0H0V36" fill="none" stroke="#102332" stroke-width="1"/>
  </pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
  <clipPath id="clip"><rect x="28" y="28" width="1544" height="704" rx="20"/></clipPath>
  <style>
    .scan{animation:scan 4s linear infinite}.pulse{animation:pulse 1.7s ease-in-out infinite}
    .dash{stroke-dasharray:9 12;animation:dash 2.6s linear infinite}.float{animation:float 3s ease-in-out infinite}
    .blink{animation:blink 1s steps(2,end) infinite}
    @keyframes scan{from{transform:translateY(-120px)}to{transform:translateY(850px)}}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    @keyframes dash{to{stroke-dashoffset:-84}}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
    @keyframes blink{50%{opacity:0}}
    text{font-family:monospace}
  </style>
</defs>

<rect width="1600" height="780" rx="28" fill="#010307"/>
<rect x="20" y="20" width="1560" height="740" rx="24" fill="url(#bg)" stroke="#20394c" stroke-width="2"/>
<rect x="28" y="28" width="1544" height="704" rx="20" fill="url(#grid)" opacity=".52"/>

<circle cx="1380" cy="160" r="240" fill="#22d3ee" opacity=".05" filter="url(#soft)"/>
<circle cx="220" cy="650" r="180" fill="#818cf8" opacity=".04" filter="url(#soft)"/>

<g clip-path="url(#clip)" pointer-events="none">
  <rect class="scan" x="28" y="28" width="1544" height="92" fill="#67e8f9" opacity=".045"/>
  <line class="scan" x1="28" y1="28" x2="1572" y2="28" stroke="#67e8f9" stroke-width="2" filter="url(#glow)"/>
</g>

