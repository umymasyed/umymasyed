<circle cx="800" cy="376" r="18" fill="#67e8f9" opacity=".9" filter="url(#glow)"/>
<text x="800" y="366" text-anchor="middle" fill="#f8fafc" font-size="17" font-weight="700">UMYMA</text>
<text x="800" y="389" text-anchor="middle" fill="#67e8f9" font-size="11">STACK CORE</text>

