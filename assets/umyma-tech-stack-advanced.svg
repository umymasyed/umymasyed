<line x1="66" y1="548" x2="1534" y2="548" stroke="#1d3447"/>
<text x="66" y="575" fill="#475569" font-size="11">SCAN RESULT :: 04 CORE MODULES / 02 EXPERIMENTAL TRACKS / API READY</text>
