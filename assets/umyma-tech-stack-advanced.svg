<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#02050a"/>
    <stop offset=".45" stop-color="#06121c"/>
    <stop offset="1" stop-color="#020409"/>
  </linearGradient>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22d3ee"/>
    <stop offset=".5" stop-color="#a5f3fc"/>
    <stop offset="1" stop-color="#22d3ee"/>
  </linearGradient>
  <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#0891b2"/>
    <stop offset="1" stop-color="#67e8f9"/>
  </linearGradient>
  <radialGradient id="orb">
    <stop offset="0" stop-color="#67e8f9" stop-opacity=".28"/>
    <stop offset=".55" stop-color="#22d3ee" stop-opacity=".08"/>
    <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#102333" stroke-width="1"/>
  </pattern>
  <filter id="glow">
    <feGaussianBlur stdDeviation="5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft">
    <feGaussianBlur stdDeviation="16"/>
  </filter>
  <clipPath id="clip"><rect x="28" y="28" width="1544" height="564" rx="20"/></clipPath>
  <style>
    .scan { animation: scan 4s linear infinite; }
    .pulse { animation: pulse 1.7s ease-in-out infinite; }
    .blink { animation: blink 1s steps(2,end) infinite; }
    .dash { stroke-dasharray: 8 12; animation: dash 2.8s linear infinite; }
    .float { animation: float 3s ease-in-out infinite; }
    @keyframes scan { from{transform:translateY(-110px)} to{transform:translateY(710px)} }
    @keyframes pulse { 0%,100%{opacity:.38} 50%{opacity:1} }
    @keyframes blink { 50%{opacity:0} }
    @keyframes dash { to{stroke-dashoffset:-80} }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }
    text{font-family:monospace}
  </style>
</defs>

<rect width="1600" height="620" rx="28" fill="#010307"/>
<rect x="20" y="20" width="1560" height="580" rx="24" fill="url(#bg)" stroke="#20394c" stroke-width="2"/>
<rect x="28" y="28" width="1544" height="564" rx="20" fill="url(#grid)" opacity=".52"/>

<circle cx="1335" cy="205" r="240" fill="url(#orb)" filter="url(#soft)"/>

<g clip-path="url(#clip)" pointer-events="none">
  <rect class="scan" x="28" y="28" width="1544" height="86" fill="#67e8f9" opacity=".045"/>
  <line class="scan" x1="28" y1="28" x2="1572" y2="28" stroke="#67e8f9" stroke-width="2" opacity=".9" filter="url(#glow)"/>
</g>

<!-- top chrome -->
<rect x="52" y="52" width="1496" height="44" rx="9" fill="#050b12" stroke="#1d3447"/>
<circle cx="78" cy="74" r="6" fill="#ef4444"/>
<circle cx="98" cy="74" r="6" fill="#eab308"/>
<circle cx="118" cy="74" r="6" fill="#22c55e"/>
<text x="145" y="80" fill="#64748b" font-size="14">UMYMA_OS://TECH_STACK_SCAN</text>
<text x="1360" y="80" fill="#22c55e" font-size="13" class="pulse">● LIVE</text>

