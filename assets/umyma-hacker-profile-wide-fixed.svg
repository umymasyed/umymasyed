<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#020409"/>
    <stop offset=".55" stop-color="#07111b"/>
    <stop offset="1" stop-color="#03070d"/>
  </linearGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22d3ee"/>
    <stop offset=".5" stop-color="#67e8f9"/>
    <stop offset="1" stop-color="#22d3ee"/>
  </linearGradient>
  <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#67e8f9" stop-opacity="0"/>
    <stop offset=".48" stop-color="#67e8f9" stop-opacity=".03"/>
    <stop offset=".5" stop-color="#a5f3fc" stop-opacity=".55"/>
    <stop offset=".52" stop-color="#67e8f9" stop-opacity=".03"/>
    <stop offset="1" stop-color="#67e8f9" stop-opacity="0"/>
  </linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#132332" stroke-width="1"/>
  </pattern>
  <filter id="glow">
    <feGaussianBlur stdDeviation="5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft">
    <feGaussianBlur stdDeviation="14"/>
  </filter>
  <clipPath id="screenClip">
    <rect x="32" y="32" width="1536" height="696" rx="18"/>
  </clipPath>
  <style>
    .scan { animation: scan 4s linear infinite; }
    .pulse { animation: pulse 1.8s ease-in-out infinite; }
    .blink { animation: blink 1s steps(2,end) infinite; }
    @keyframes scan {
      from { transform: translateY(-120px); }
      to { transform: translateY(880px); }
    }
    @keyframes pulse {
      0%,100% { opacity: .45; }
      50% { opacity: 1; }
    }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
</defs>

