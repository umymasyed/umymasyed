<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#02050a"/>
    <stop offset=".5" stop-color="#07131d"/>
    <stop offset="1" stop-color="#03060b"/>
  </linearGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22d3ee"/>
    <stop offset=".5" stop-color="#a5f3fc"/>
    <stop offset="1" stop-color="#22d3ee"/>
  </linearGradient>
  <radialGradient id="halo">
    <stop offset="0" stop-color="#22d3ee" stop-opacity=".16"/>
    <stop offset=".6" stop-color="#22d3ee" stop-opacity=".04"/>
    <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
    <path d="M36 0H0V36" fill="none" stroke="#112433" stroke-width="1"/>
  </pattern>
  <filter id="glow">
    <feGaussianBlur stdDeviation="5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft"><feGaussianBlur stdDeviation="22"/></filter>
  <clipPath id="clip"><rect x="28" y="28" width="1544" height="464" rx="20"/></clipPath>
  <style>
    .scan{animation:scan 4.2s linear infinite}
    .pulse{animation:pulse 1.8s ease-in-out infinite}
    .blink{animation:blink 1s steps(2,end) infinite}
    .dash{stroke-dasharray:10 12;animation:dash 3s linear infinite}
    @keyframes scan{from{transform:translateY(-100px)}to{transform:translateY(650px)}}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    @keyframes blink{50%{opacity:0}}
    @keyframes dash{to{stroke-dashoffset:-88}}
    text{font-family:monospace}
  </style>
</defs>

<rect width="1600" height="520" rx="28" fill="#010307"/>
<rect x="20" y="20" width="1560" height="480" rx="24" fill="url(#bg)" stroke="#20394c" stroke-width="2"/>
<rect x="28" y="28" width="1544" height="464" rx="20" fill="url(#grid)" opacity=".5"/>

<circle cx="800" cy="275" r="250" fill="url(#halo)" filter="url(#soft)"/>

<g clip-path="url(#clip)" pointer-events="none">
  <rect class="scan" x="28" y="28" width="1544" height="82" fill="#67e8f9" opacity=".045"/>
  <line class="scan" x1="28" y1="28" x2="1572" y2="28" stroke="#67e8f9" stroke-width="2" filter="url(#glow)"/>
</g>

<!-- top chrome -->
<rect x="52" y="52" width="1496" height="42" rx="9" fill="#050b12" stroke="#1d3447"/>
<circle cx="78" cy="73" r="6" fill="#ef4444"/>
<circle cx="98" cy="73" r="6" fill="#eab308"/>
<circle cx="118" cy="73" r="6" fill="#22c55e"/>
<text x="145" y="79" fill="#64748b" font-size="14">UMYMA_OS://FINAL_TRANSMISSION</text>
<text x="1365" y="79" fill="#22c55e" font-size="13" class="pulse">● SESSION COMPLETE</text>

<!-- center visual -->
<circle cx="800" cy="235" r="105" fill="none" stroke="#1a4355" stroke-width="1"/>
<circle cx="800" cy="235" r="80" fill="none" stroke="#22d3ee" stroke-width="1.5" opacity=".7" class="dash"/>
<circle cx="800" cy="235" r="52" fill="#06141e" stroke="#67e8f9" opacity=".95" filter="url(#glow)"/>
<text x="800" y="229" text-anchor="middle" fill="#f8fafc" font-size="21" font-weight="700">UMYMA</text>
<text x="800" y="249" text-anchor="middle" fill="#67e8f9" font-size="10">SYSTEM BUILDER</text>

<!-- headline -->
<text x="800" y="335" text-anchor="middle" fill="#f8fafc" font-size="38" font-weight="700">
  BUILD. BREAK. LEARN. REBUILD.
</text>
<text x="800" y="370" text-anchor="middle" fill="#94a3b8" font-size="16">
  Every idea is a starting point. Every iteration makes it better.
</text>

<!-- signature -->
<text x="800" y="415" text-anchor="middle" fill="#67e8f9" font-size="18" class="pulse">
  — UMYMA SYED —
</text>

<!-- status -->
<line x1="250" y1="446" x2="1350" y2="446" stroke="#1d3447"/>
<text x="330" y="468" fill="#475569" font-size="11">FINAL STATUS</text>
<text x="430" y="468" fill="#22c55e" font-size="11">[ ALWAYS BUILDING ]</text>
<text x="720" y="468" fill="#475569" font-size="11">MODE</text>
<text x="770" y="468" fill="#cbd5e1" font-size="11">CURIOUS / CONSISTENT / CREATIVE</text>
<text x="1245" y="468" fill="#67e8f9" font-size="11">root@umyma:~$ <tspan class="blink">█</tspan></text>
</svg>