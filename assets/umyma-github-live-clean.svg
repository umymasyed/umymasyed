<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#02050a"/><stop offset=".5" stop-color="#07131d"/><stop offset="1" stop-color="#03070d"/>
  </linearGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#a5f3fc"/><stop offset="1" stop-color="#22d3ee"/>
  </linearGradient>
  <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#16a34a"/><stop offset=".5" stop-color="#4ade80"/><stop offset="1" stop-color="#86efac"/>
  </linearGradient>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
    <path d="M36 0H0V36" fill="none" stroke="#102332" stroke-width="1"/>
  </pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="20"/></filter>
  <clipPath id="clip"><rect x="28" y="28" width="1544" height="704" rx="20"/></clipPath>
  <style>
    .scan{animation:scan 4s linear infinite}
    .pulse{animation:pulse 1.6s ease-in-out infinite}
    .dash{stroke-dasharray:8 12;animation:dash 2.8s linear infinite}
    .blink{animation:blink 1s steps(2,end) infinite}
    @keyframes scan{from{transform:translateY(-100px)}to{transform:translateY(820px)}}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    @keyframes dash{to{stroke-dashoffset:-80}}
    @keyframes blink{50%{opacity:0}}
    text{font-family:monospace}
  </style>
</defs>

