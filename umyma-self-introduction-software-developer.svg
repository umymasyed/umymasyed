<text x="72" y="349" fill="#f8fafc" font-size="16">SOFTWARE DEVELOPER • BUILDER • PROBLEM SOLVER</text>

<text x="72" y="386" fill="#64748b" font-size="12">PERSONAL MOTTO</text>
