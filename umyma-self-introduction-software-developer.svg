<text x="1050" y="171" fill="#67e8f9" font-size="12">SOCIAL SIGNAL</text>
<text x="1050" y="220" fill="#f8fafc" font-size="43" font-weight="700">20K+</text>
<text x="1052" y="249" fill="#94a3b8" font-size="15">LinkedIn followers</text>

