<rect x="1050" y="390" width="188" height="18" rx="9" fill="url(#cyan)" opacity=".8"/>
<text x="1268" y="404" fill="#22c55e" font-size="10" class="pulse">GROWING</text>

<!-- footer -->
<line x1="70" y1="485" x2="1530" y2="485" stroke="#1d3447"/>
<text x="70" y="505" fill="#475569" font-size="11">IDENTITY SCAN COMPLETE</text>
<text x="1325" y="505" fill="#22c55e" font-size="11" class="pulse">[ ONLINE ]</text>
