<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="540" viewBox="0 0 1600 540">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#02050a"/>
    <stop offset=".5" stop-color="#07131d"/>
    <stop offset="1" stop-color="#03070d"/>
  </linearGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22d3ee"/>
    <stop offset=".5" stop-color="#a5f3fc"/>
    <stop offset="1" stop-color="#22d3ee"/>
  </linearGradient>
  <radialGradient id="glow">
    <stop offset="0" stop-color="#22d3ee" stop-opacity=".20"/>
    <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
    <path d="M36 0H0V36" fill="none" stroke="#102332" stroke-width="1"/>
  </pattern>
  <filter id="soft"><feGaussianBlur stdDeviation="20"/></filter>
  <filter id="neon">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="clip"><rect x="28" y="28" width="1544" height="484" rx="20"/></clipPath>
  <style>
    .scan{animation:scan 4s linear infinite}
    .pulse{animation:pulse 1.8s ease-in-out infinite}
    .blink{animation:blink 1s steps(2,end) infinite}
    @keyframes scan{from{transform:translateY(-100px)}to{transform:translateY(650px)}}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    @keyframes blink{50%{opacity:0}}
    text{font-family:monospace}
  </style>
</defs>

<rect width="1600" height="540" rx="28" fill="#010307"/>
<rect x="20" y="20" width="1560" height="500" rx="24" fill="url(#bg)" stroke="#20394c" stroke-width="2"/>
<rect x="28" y="28" width="1544" height="484" rx="20" fill="url(#grid)" opacity=".5"/>

<circle cx="1310" cy="230" r="250" fill="url(#glow)" filter="url(#soft)"/>

<g clip-path="url(#clip)" pointer-events="none">
  <rect class="scan" x="28" y="28" width="1544" height="78" fill="#67e8f9" opacity=".045"/>
  <line class="scan" x1="28" y1="28" x2="1572" y2="28" stroke="#67e8f9" stroke-width="2" opacity=".85" filter="url(#neon)"/>
</g>

<!-- top bar -->
<rect x="55" y="52" width="1490" height="44" rx="9" fill="#050b12" stroke="#1d3447"/>
<circle cx="80" cy="74" r="6" fill="#ef4444"/>
<circle cx="100" cy="74" r="6" fill="#eab308"/>
<circle cx="120" cy="74" r="6" fill="#22c55e"/>
<text x="148" y="80" fill="#64748b" font-size="14">UMYMA_OS://IDENTITY</text>
<text x="1368" y="80" fill="#22c55e" font-size="13" class="pulse">● VERIFIED</text>

